# Every PR that touches terraform/: notify CET in Teams, run checks, post the plan.
# "validate" and "plan" are required status checks in the master ruleset.
name: terraform-pr

on:
  pull_request:
    branches: [master]
    paths: ["terraform/**", "config/**", "scripts/**", ".github/workflows/**"]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: terraform-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  notify:
    if: github.event.action == 'opened' || github.event.action == 'ready_for_review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Post to the CET Teams channel
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python scripts/teams_notify.py --title "Review needed: $PR_TITLE" \
            --text "Needs Cloud Engineering approval before merge." \
            --fact "Author=$PR_AUTHOR" --url "$PR_URL" --button "Review PR"

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v4

      - name: Unit tests (generator)
        run: |
          pip install -q -r requirements-dev.txt
          pytest -q

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform

      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: tflint
        run: |
          tflint --init
          tflint --chdir=terraform --recursive

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write        # Workload Identity login to GCP
      pull-requests: write   # plan comment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # Practice mode: with no GCP_WIF_PROVIDER variable, the plan is skipped (with a note)
      # and the check still passes, so you can test everything up to merge without GCP.
      - name: Practice mode (no GCP configured)
        id: practice
        if: vars.GCP_WIF_PROVIDER == ''
        run: |
          echo "Practice mode: GCP_WIF_PROVIDER is not set, so terraform plan was skipped." > plan.txt
          echo "Files in this PR:" >> plan.txt
          git fetch -q origin "$GITHUB_BASE_REF"
          git diff --name-status "origin/$GITHUB_BASE_REF...HEAD" -- terraform >> plan.txt || true
          echo "(practice mode: no GCP)" > summary.txt

      - name: GCP login (read-only plan service account)
        if: vars.GCP_WIF_PROVIDER != ''
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAN_SA }}

      - name: terraform plan
        id: plan
        if: vars.GCP_WIF_PROVIDER != ''
        run: |
          set -o pipefail
          terraform -chdir=terraform init -input=false
          terraform -chdir=terraform plan -input=false -no-color -lock=false -out=tfplan \
            | tee plan.txt
          terraform -chdir=terraform show -no-color tfplan | grep -E "^Plan:|^No changes" \
            | tail -1 > summary.txt || true

      - name: Comment the plan on the PR
        if: always()
        uses: actions/github-script@v7
        env:
          PLAN_OK: ${{ steps.plan.outcome == 'success' || steps.practice.outcome == 'success' }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            let plan = fs.existsSync('plan.txt') ? fs.readFileSync('plan.txt', 'utf8') : '(no plan output)';
            const summary = fs.existsSync('summary.txt') ? fs.readFileSync('summary.txt', 'utf8').trim() : '';
            if (plan.length > 60000) plan = plan.slice(-60000) + '\n(truncated: see the workflow log)';
            const ok = process.env.PLAN_OK === 'true';
            const body = `${marker}\n### terraform plan ${ok ? '✅' : '❌'} ${summary}\n` +
              `<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n` +
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.body && c.body.startsWith(marker));
            if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
